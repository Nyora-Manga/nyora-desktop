name: Mirror verified desktop release
on:
  workflow_call:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Nyora-Manga/nyora-desktop
          ref: main
          persist-credentials: false
          sparse-checkout: distribution
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify and mirror both architectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: node distribution/mirror-release.mjs
